paper:
  slug: decouple-re-identification-and-human-parsing-for-occluded-person-re
  title: "Decouple Re-Identification and Human Parsing for Occluded Person Re-Identification"
  doi: "10.1109/TBIOM.2026.3680760"
device: cuda
data:
  root: ../../datasets/market1501
  height: 256
  width: 128
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  random_erasing: true
  num_workers: 4
model:
  backbone: resnet50
  feat_dim: 256
  num_parts: 5
  pretrained: true
train:
  epochs: 120
  batch_size: 64
  num_instances: 4
  lr: 0.00035
  lr_drops: [40, 70]
  weight_decay: 0.0005
  margin: 0.3
  label_smoothing: 0.1
  lambda_tri: 1.0
  lambda_pct: 1.0
  lambda_parse: 0.4
  seed: 42
eval:
  batch_size: 64
  ranks: [1, 5, 10]
  every: 20
paths:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  pred_dir: outputs/predictions
  figure_dir: outputs/figures
